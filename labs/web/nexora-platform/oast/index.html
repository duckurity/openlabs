<!doctype html><html><head><title>Nexora Local OAST</title><style>body{font:15px Arial;max-width:900px;margin:45px auto;background:#f7f8fa;color:#172033}code{background:#e9edf4;padding:2px 5px}article{background:white;border:1px solid #ddd;border-radius:8px;padding:15px;margin:10px 0}.tag{font-weight:bold;color:#295bd6}</style></head><body><h1>Nexora Local OAST</h1><p>Use a unique subdomain such as <code>test123.oast.ctf</code>. Refreshes every three seconds.</p><section id="items">Loading…</section><script>async function load(){let x=await fetch('/api/interactions').then(r=>r.json());items.innerHTML=x.length?x.map(i=>`<article><span class=tag>${i.kind} Interaction</span><br><b>${i.hostname}</b>${i.path?' '+i.path:''}<br><small>${i.time}</small></article>`).join(''):'No interactions yet.'}load();setInterval(load,3000)</script></body></html>
