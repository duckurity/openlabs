name: last-reel
services:
  last-reel:
    image: last-reel:local
    pull_policy: never
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    labels:
      org.openlabs.lab: last-reel
    user: 10001:10001
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /run/last-reel:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=0700
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=0700
    networks: [backend]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    pids_limit: 64
    restart: "no"
    logging:
      driver: json-file
      options: {max-size: "1m", max-file: "2"}
  last-reel-ingress:
    image: last-reel-ingress:local
    pull_policy: never
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.ingress
    labels:
      org.openlabs.lab: last-reel
    user: 10001:10001
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      last-reel: {condition: service_healthy}
    ports: ["127.0.0.1:8080:8000"]
    networks: [backend, frontend]
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.5
    pids_limit: 32
    restart: "no"
    logging:
      driver: json-file
      options: {max-size: "1m", max-file: "2"}
networks:
  backend:
    internal: true
    labels: {org.openlabs.lab: last-reel}
  frontend:
    labels: {org.openlabs.lab: last-reel}
