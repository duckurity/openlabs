events {}

http {
    upstream web_app {
        server web-app:3000;
    }

    upstream registry_public {
        server registry-public:4873;
    }

    server {
        listen 80;

        location /registry/ {
            proxy_pass http://registry_public/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://web_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
