services:
  main-app:
    build: ./main-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - INTERNAL_SERVICE_HOST=internal-processing-svc
      - INTERNAL_SERVICE_PORT=8081
    volumes:
      - snapsync_data:/app/data
      - snapsync_uploads:/app/uploads
      - snapsync_keys:/app/keys
    depends_on:
      - internal-processing-svc
    networks:
      - snapsync_net

  internal-processing-svc:
    build: ./internal-service
    restart: unless-stopped
    # Intentionally NOT published to the host - only reachable from
    # main-app over the internal docker network, simulating a private
    # internal service.
    expose:
      - "8081"
    environment:
      - PORT=8081
      - FLAG_FILE=/run/secrets/flag
    secrets:
      - flag
    networks:
      - snapsync_net

networks:
  snapsync_net:
    driver: bridge

volumes:
  snapsync_data:
  snapsync_uploads:
  snapsync_keys:

secrets:
  flag:
    file: ./internal-service/app/flag.txt
