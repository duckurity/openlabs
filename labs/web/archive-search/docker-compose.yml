services:
  web:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SECURE_MODE: "${SECURE_MODE:-0}"
    volumes:
      - archive-data:/srv/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - lab
    restart: "no"

volumes:
  archive-data:

networks:
  lab:
    driver: bridge
