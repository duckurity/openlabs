name: Lab idea
description: Propose a lab for the library
labels:
  - enhancement
  - component:lab
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Do not paste flags, tokens, API keys, or private host paths. Lab
        vulnerabilities you want players to find belong in the lab design, not
        in this form.

        Report repository or infrastructure vulnerabilities through
        [private vulnerability reporting](https://github.com/duckurity/openlabs/security/advisories/new),
        not through public issues.
  - type: dropdown
    id: track
    attributes:
      label: Track
      description: Which track does the lab belong to?
      options:
        - web
        - binary
        - crypto
        - network
        - osint
    validations:
      required: true
  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      description: Grade against the rubric in CONTRIBUTING.md.
      options:
        - easy
        - medium
        - hard
        - insane
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What does the player do? What is the intended vector? What service or environment does it need?
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Papers, CVEs, talks, or prior art that support the design. Optional.
    validations:
      required: false
