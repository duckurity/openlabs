name: Lab bug
description: A lab does not work as documented
labels:
  - bug
  - component:lab
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        **Redaction:** Do not paste flags, tokens, API keys, or sensitive host
        paths. Replace secrets with `[redacted]` and trim command output to the
        failing lines.

        **Security:** Report repository or infrastructure vulnerabilities through
        [private vulnerability reporting](https://github.com/duckurity/openlabs/security/advisories/new).
        Do not use this form for security reports. Lab vulnerabilities that are
        part of the challenge design are not defects.
  - type: input
    id: lab
    attributes:
      label: Lab
      description: Full path, for example labs/web/duck-cross
    validations:
      required: true
  - type: textarea
    id: what-breaks
    attributes:
      label: What breaks
      description: What happens, and what does the brief say should happen instead?
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows (WSL)
        - Other
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: CPU architecture
      options:
        - x86_64
        - arm64
        - other
    validations:
      required: true
  - type: input
    id: docker-version
    attributes:
      label: Docker version
      description: Paste the `Client:`/`Server:` lines from `docker version`.
    validations:
      required: true
  - type: input
    id: compose-version
    attributes:
      label: Compose version
      description: Paste the output of `docker compose version`.
    validations:
      required: true
  - type: textarea
    id: failing-command
    attributes:
      label: Failing command
      description: The exact command you ran (for example `docker compose up -d`).
    validations:
      required: true
  - type: textarea
    id: command-output
    attributes:
      label: Command output (redacted)
      description: Relevant stderr/stdout. Redact secrets and private paths.
    validations:
      required: true
  - type: input
    id: flag-check
    attributes:
      label: Did the checker accept your flag?
      description: Run `python3 scripts/check.py <lab path>` and state the result. Optional.
    validations:
      required: false
