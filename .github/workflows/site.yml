name: site

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "content/**"
      - "hooks/**"
      - "lib/**"
      - "public/**"
      - "labs/**/lab.yml"
      - "labs/**/README.md"
      - "scripts/sync_site_content.py"
      - "package.json"
      - "pnpm-lock.yaml"
      - "next.config.ts"
      - "source.config.ts"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Sync lab content
        run: python3 scripts/sync_site_content.py --check

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
