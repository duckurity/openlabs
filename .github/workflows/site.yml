name: site

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "content/**"
      - "hooks/**"
      - "lib/**"
      - "public/**"
      - "labs/**/lab.yml"
      - "labs/**/README.md"
      - "scripts/sync_site_content.py"
      - "scripts/make_og_images.py"
      - "scripts/make_shapes.py"
      - "package.json"
      - "pnpm-lock.yaml"
      - "next.config.ts"
      - "source.config.ts"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          pip install -r requirements-dev.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          NEXT_PUBLIC_APP_URL: https://openlabs.duckurity.com
        run: pnpm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
