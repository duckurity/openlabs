name: labs

on:
  pull_request:
    paths:
      - "labs/**"
      - "scripts/**"
      - "content/**"
      - "contentbit.config.ts"
      - "contentbit.seo.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/labs.yml"
  push:
    branches: [main]
    paths:
      - "labs/**"
      - "scripts/**"
      - "content/**"
      - "contentbit.config.ts"
      - "contentbit.seo.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"

jobs:
  validate:
    name: Validate labs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate lab structure and metadata
        run: python3 scripts/validate.py

      - name: Validate compose files
        run: |
          docker compose version
          python3 scripts/validate.py --compose

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Real leaked secrets are never intended. Generic SAST is
      # intentionally absent: labs are vulnerable by design and no
      # rule set can tell intent from accident. score_lab.py covers
      # the calibrated checks instead.
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2

      - name: Score every lab (blocking)
        run: python3 scripts/score_lab.py --min 70

      - name: Scan filesystem for known vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: labs/
          severity: HIGH,CRITICAL
          exit-code: "1"
          cache: "true"

  content:
    name: Content contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate lab pages
        run: python3 scripts/sync_site_content.py

      - name: Check strict SEO contracts
        run: pnpm exec contentbit doctor --strict-seo

  pdf:
    name: Build lab sheets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PDF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-latex-extra \
            librsvg2-bin
          xelatex --version >/dev/null
          rsvg-convert --version >/dev/null

      - name: Build every lab sheet with strict layout checks
        run: python3 scripts/make_lab_pdf.py --all --strict
