name: brand

on:
  push:
    branches: [main]
    paths:
      - "labs/**"
      - "wiki/**"
      - "README.md"
      - "scripts/**"
      - ".github/assets/**"
      - ".github/workflows/brand.yml"

permissions:
  contents: write

concurrency:
  group: brand
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonttools
        run: pip install "fonttools==4.63.0"

      - name: Regenerate badges
        run: python3 scripts/make_badges.py

      - name: Bump asset versions
        run: python3 scripts/sync_wiki.py bump

      - name: Commit refreshed assets
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "chore: refresh brand assets"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync wiki
        run: python3 scripts/sync_wiki.py wiki
