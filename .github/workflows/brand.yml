name: brand

on:
  push:
    branches: [main]
    paths:
      - "labs/**"
      - "wiki/**"
      - "README.md"
      - "scripts/**"
      - ".github/assets/**"
      - ".github/workflows/brand.yml"
      - "requirements-dev.txt"

permissions:
  contents: write

concurrency:
  group: brand
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install build dependency
        run: pip install -r requirements-dev.txt

      - name: Regenerate badges
        run: python3 scripts/make_badges.py

      - name: Bump asset version parameters
        run: python3 scripts/sync_wiki.py bump

      - name: Commit refreshed assets
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "changes=none" >> "$GITHUB_OUTPUT"
            echo "no changes to commit"
          else
            git add -A
            git commit -m "chore: refresh brand assets"
            git push
            echo "changes=committed" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync wiki
        if: always()
        env:
          WIKI_PUSH_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN }}
        run: python3 scripts/sync_wiki.py wiki
