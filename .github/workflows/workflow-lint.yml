# Lint GitHub Actions workflows and related CI fixtures on pull requests.
name: workflow-lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "scripts/lint_workflows.sh"
      - "scripts/validate_issue_forms.py"
      - "scripts/fixtures/issue_form_labels.json"
      - "scripts/fixtures/ci_routing_matrix.json"
      - "scripts/fixtures/m0_exit_criteria.json"
      - "scripts/fixtures/m0_branch_protection.json"
      - "scripts/fixtures/lab_author_github.json"
      - "scripts/test_ci_routing_matrix.py"
      - "scripts/test_sync_site_content.py"
      - "scripts/baseline_report.py"
      - "scripts/test_baseline_report.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "scripts/lint_workflows.sh"
      - "scripts/validate_issue_forms.py"
      - "scripts/fixtures/issue_form_labels.json"
      - "scripts/fixtures/ci_routing_matrix.json"
      - "scripts/fixtures/m0_exit_criteria.json"
      - "scripts/fixtures/m0_branch_protection.json"
      - "scripts/fixtures/lab_author_github.json"
      - "scripts/test_ci_routing_matrix.py"
      - "scripts/test_sync_site_content.py"
      - "scripts/baseline_report.py"
      - "scripts/test_baseline_report.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run actionlint
        uses: rhysd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106 # v1.7.7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate issue forms
        run: python3 scripts/validate_issue_forms.py

      - name: Validate CI routing matrix fixture
        run: python3 scripts/test_ci_routing_matrix.py

      - name: Validate M0 baseline report
        run: python3 scripts/test_baseline_report.py

      - name: Validate lab author GitHub fixture
        run: python3 scripts/test_sync_site_content.py
