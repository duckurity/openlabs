name: sponsors

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync sponsor wall
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync sponsors data
        env:
          SPONSORS_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
        run: python3 scripts/sync_sponsors.py

      - name: Commit and push if changed
        run: |
          git diff --quiet lib/sponsors.json || (
            git config user.name "github-actions[bot]" &&
            git config user.email "github-actions[bot]@users.noreply.github.com" &&
            git add lib/sponsors.json &&
            git commit -m "chore(site): sync sponsor wall" &&
            git push
          )
