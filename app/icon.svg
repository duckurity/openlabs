<svg width="250" height="250" viewBox="0 0 250 250" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Color-aware favicon: Ink arms on light tabs, Warm arms on dark
tabs, Ember accent always. Hex is literal: favicons render without
page CSS, so tokens cannot resolve here. Regenerate the dark PNG
with: printf '.arms{fill:#F4F2F1 !important}\n' > /tmp/icon-dark.css
&& rsvg-convert -w 180 -h 180 -s /tmp/icon-dark.css app/icon.svg
-o app/apple-icon.png. Plain rsvg output is the light variant. -->
<style>
.arms { fill: #1E1E1E; }
.accent { fill: #FF3616; }
@media (prefers-color-scheme: dark) {
.arms { fill: #F4F2F1; }
}
</style>
<path class="arms" d="M83.3334 166.666V250H166.666V166.666H83.3334Z"/>
<path class="arms" d="M83.3334 0V83.3334H166.666V0H83.3334Z"/>
<path class="arms" d="M166.666 166.666H250V83.3334H166.666V166.666Z"/>
<path class="arms" d="M83.3334 83.3334H0V166.666H83.3334V83.3334Z"/>
<path class="accent" d="M83.3334 0H0V83.3334H83.3334V0Z"/>
</svg>
